<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Omkar Sanadi</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
  /* Self-contained: a 404 can be served from any path, so it links to no other file. */
  *{box-sizing:border-box}
  html{color-scheme:light}
  body{margin:0;background:#ffffff;color:#111827;min-height:100vh;display:grid;place-items:center;
    padding:40px 24px;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
  ::selection{background:#bbf7d0;color:#052e16}
  main{max-width:520px}
  .code{margin:0;font-size:.95rem;font-weight:700;color:#15803d;font-variant-numeric:tabular-nums}
  h1{font-size:clamp(2rem,6vw,3rem);line-height:1.08;letter-spacing:-.035em;margin:10px 0 0}
  p.msg{color:#4b5563;margin:16px 0 32px;max-width:44ch;font-size:1.06rem}
  a.btn{display:inline-block;background:#15803d;color:#ffffff;text-decoration:none;font-weight:600;
    padding:14px 24px;border-radius:10px;box-shadow:0 1px 2px rgba(17,24,39,.06);
    transition:background 200ms ease,transform 160ms cubic-bezier(0.23,1,0.32,1)}
  a.btn:hover{background:#166534}
  a.btn:focus-visible{outline:2px solid #15803d;outline-offset:3px}
  @media (hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){
    a.btn:hover{transform:translateY(-1px)}
  }
  a.btn:active{transform:scale(.97)}
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>This page does not exist</h1>
    <p class="msg">The link is broken or the page has moved. Head back to the homepage and start over.</p>
    <a class="btn" id="home" href="/">Back to homepage</a>
  </main>
<script>
  /* On a GitHub Pages project site the root is /<repo>/, not /. */
  (function () {
    var seg = location.pathname.split('/')[1];
    if (location.hostname.indexOf('github.io') !== -1 && seg) {
      document.getElementById('home').href = '/' + seg + '/';
    }
  })();
</script>
</body>
</html>
